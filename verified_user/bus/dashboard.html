<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/dashboard.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <title>Ted's Delivery Service</title>
</head>
<body onload="{displayAccInfo()}">
    <div class="flex_vert_center">
        <img id="img_acc" src="" />
        <h1 id="h1_name"></h1>
    </div>
    <fieldset class="flex_vert_center">
        <legend>Order Management</legend>

        <div class="flex-vert-center">
            <a id="a_create_order" href="/dashboardcreate_order">Create Order</a>
            <a id="a_read_order" href="/dashboardread_order">View Your Order(s)</a>
            <a id="a_update_order" href="/dashboardupdate_order">Update/Cancel Your Order(s)</a>
        </div>
    </fieldset>

    <fieldset class="flex_vert_center">
        <legend>Business Management</legend>
        
        <div class="flex-vert-center">
            <button id="button_logout" type="button" onclick="{logout()}">Logout</button>
            <a id="a_create_bus_items" href="/dashboardcreate_items">Add items to inventory</a>
            <a id="a_read_bus" href="/dashboardread_bus">View Business Info</a>
            <a id="a_update_bus" href="/dashboardupdate_bus">Update Business Info</a>
            <button id="button_delete_bus" type="button" onclick="{deleteAccount()}">Delete this Account</button>
        </div>
    </fieldset>
</body>
</html>
