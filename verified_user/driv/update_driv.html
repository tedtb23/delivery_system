<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="dashboard.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <title>Ted's Delivery Service</title>
  </head>
  <body onload='{displayUpdateAccInfo("driv")}'>
    <fieldset class="flex-vert-center">
      <legend>Update Driver Info</legend>

      <a href="/dashboard">Return</a>

      <h1>Fill out the field(s) you wish to update</h1>

      <form
        id="form_update_acc_info"
        class="flex-vert-center"
        onsubmit="{updateAccInfo(event)}"
      ></form>
    </fieldset>
  </body>
</html>
